name: Deploy to GitHub Pages

on:
  # Deploy only fires on a version tag (v1.2.3-alpha, ...) - i.e. only once a change has been
  # explicitly tagged as a release, not on every commit to main. Ordinary commits/pushes to main
  # just accumulate there untouched; nothing reaches the live site until a tag lands. This lets
  # several changes get committed and bug-tested locally (`npm run preview`) before any of them
  # actually go live together. workflow_dispatch stays as a manual escape hatch for redeploying
  # the current tag without cutting a new one (e.g. Pages itself needs a nudge).
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run build
        env:
          GITHUB_PAGES: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
